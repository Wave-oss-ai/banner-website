<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparkman Staff</title><style>body{font:16px system-ui;background:#f8f4eb;color:#183a31;padding:25px}main{max-width:800px;margin:auto}input,button,select{padding:12px;margin:6px;font:inherit}article{background:white;padding:20px;margin:12px 0;border-radius:12px}button{background:#183a31;color:white;border:0;border-radius:6px}</style><main><h1>Staff inbox and appointments</h1><p><a href="/">Back to website</a></p><div id="login"><input type="password" id="password" placeholder="Staff password"><button id="signin">Sign in</button></div><div id="dashboard" hidden><button id="reload">Refresh</button><div id="items"></div></div><p id="status" role="status"></p></main><script>
const api='https://sparkman-clinic-api.onrender.com',e=id=>document.getElementById(id);let token='';
async function load(){const r=await fetch(api+'/api/staff/requests',{headers:{Authorization:'Bearer '+token}});if(!r.ok){e('status').textContent='Unable to load requests';return}const data=await r.json();e('items').replaceChildren();for(const item of data.requests){const a=document.createElement('article');const h=document.createElement('h3');h.textContent=item.kind+' — '+item.status;const p=document.createElement('p');p.textContent=[item.name,item.email,item.phone,item.pet,item.requested_date,item.requested_time,item.message].filter(Boolean).join(' | ');a.append(h,p);const select=document.createElement('select');for(const status of ['pending','approved','declined','answered']){const o=document.createElement('option');o.value=status;o.textContent=status;o.selected=status===item.status;select.append(o)}select.onchange=async()=>{const r=await fetch(api+'/api/staff/requests/'+item.id,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});e('status').textContent=r.ok?'Saved; contact the customer to confirm.':'Could not save';};a.append(select);e('items').append(a)}}
e('signin').onclick=async()=>{const r=await fetch(api+'/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e('password').value})});if(!r.ok){e('status').textContent='Login failed';return}token=(await r.json()).token;e('password').value='';e('login').hidden=true;e('dashboard').hidden=false;load()};e('reload').onclick=load;
</script></html>
